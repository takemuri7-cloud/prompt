<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Prompt Vault 2.2</title>
<style>
:root{
  --bg:#f6f7fb;
  --panel:#ffffff;
  --panel-soft:#f8fafc;
  --border:#e5e7eb;
  --border-strong:#cbd5e1;
  --text:#172033;
  --muted:#64748b;
  --muted-2:#94a3b8;
  --accent:#4f46e5;
  --accent-soft:#eef2ff;
  --accent-hover:#4338ca;
  --danger:#dc2626;
  --danger-soft:#fef2f2;
  --success:#166534;
  --success-soft:#f0fdf4;
  --shadow:0 10px 30px rgba(15,23,42,.08);
  --radius:14px;
  --sidebar:188px;
  --detail:430px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans JP",sans-serif}
body{min-height:100vh}
button,input,textarea{font:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.45}
button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid rgba(79,70,229,.24);outline-offset:2px}
.hidden{display:none!important}
.icon-btn,.plain-btn,.primary-btn,.secondary-btn,.danger-btn,.copy-btn,.menu-btn{border:0}
.icon-btn{width:40px;height:40px;border-radius:11px;background:transparent;color:var(--muted);font-size:20px;display:inline-flex;align-items:center;justify-content:center}
.icon-btn:hover{background:#f1f5f9;color:var(--text)}
.primary-btn{background:var(--accent);color:#fff;border-radius:11px;padding:10px 15px;font-weight:700}
.primary-btn:hover{background:var(--accent-hover)}
.secondary-btn{background:#fff;color:var(--text);border:1px solid var(--border);border-radius:11px;padding:9px 13px;font-weight:650}
.secondary-btn:hover{background:#f8fafc}
.danger-btn{background:var(--danger-soft);color:var(--danger);border-radius:11px;padding:10px 14px;font-weight:700}
.plain-btn{background:transparent;color:var(--accent);padding:6px 8px;font-weight:700}
.copy-btn{min-width:70px;background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:8px 11px;font-weight:800;white-space:nowrap;font-size:14px}
.copy-btn:hover{background:#e0e7ff}
.copy-btn.copied{background:var(--success-soft);color:var(--success)}
.menu-btn{width:38px;height:38px;border-radius:10px;background:transparent;color:var(--muted);font-weight:800;font-size:20px}
.menu-btn:hover{background:#f1f5f9}

.app-shell{min-height:100vh;display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);grid-template-rows:64px 1fr;grid-template-areas:"brand top" "side main"}
.brand{grid-area:brand;background:var(--panel);border-right:1px solid var(--border);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 18px;font-size:17px;font-weight:850;letter-spacing:-.02em}
.topbar{grid-area:top;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 18px;position:sticky;top:0;z-index:30}
.topbar-title{font-weight:800;font-size:18px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-spacer{flex:1}
.search-box{position:relative;width:min(360px,42vw)}
.search-box input{width:100%;height:40px;border:1px solid var(--border);border-radius:11px;background:#f8fafc;padding:0 38px 0 13px;color:var(--text);outline:none}
.search-box input:focus{border-color:#a5b4fc;background:#fff;box-shadow:0 0 0 3px rgba(79,70,229,.08)}
.search-clear{position:absolute;right:5px;top:4px;width:32px;height:32px;border:0;background:transparent;color:var(--muted-2);border-radius:9px}
.sidebar{grid-area:side;background:var(--panel);border-right:1px solid var(--border);padding:14px 10px;position:sticky;top:64px;height:calc(100vh - 64px);overflow:auto}
.nav-btn{width:100%;display:flex;align-items:center;gap:10px;padding:10px 11px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-weight:700;text-align:left;margin-bottom:4px}
.nav-btn:hover{background:#f8fafc;color:var(--text)}
.nav-btn.active{background:var(--accent-soft);color:var(--accent)}
.nav-icon{width:22px;text-align:center}
.nav-count{margin-left:auto;font-size:12px;color:var(--muted-2);font-weight:700}
.side-section{margin-top:20px;padding:0 10px 7px;color:var(--muted-2);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.side-link{width:100%;border:0;background:transparent;text-align:left;padding:8px 11px;border-radius:9px;color:var(--muted);font-size:13px}
.side-link:hover{background:#f8fafc;color:var(--text)}

.main{grid-area:main;min-width:0;display:flex;position:relative}
.content{min-width:0;flex:1;padding:24px clamp(18px,3vw,38px) 90px;overflow:auto}
.content.with-detail{padding-right:24px}
.content-head{display:flex;align-items:flex-end;gap:16px;margin:2px 0 16px}
.content-head h1{font-size:22px;letter-spacing:-.03em;margin:0}
.content-sub{color:var(--muted);font-size:13px;margin-top:5px}
.content-head .spacer{flex:1}
.small-btn{border:1px solid var(--border);background:#fff;border-radius:10px;padding:8px 11px;color:var(--muted);font-size:13px;font-weight:700}
.small-btn:hover{color:var(--text);background:#f8fafc}

.prompt-list{background:var(--panel);border:1px solid var(--border);border-radius:15px;overflow:visible;box-shadow:0 1px 2px rgba(15,23,42,.02)}
.prompt-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:10px;min-height:59px;padding:9px 9px 9px 16px;border-bottom:1px solid #edf0f4;position:relative}
.prompt-row:last-child{border-bottom:0}
.prompt-row:hover{background:#fbfcff}
.prompt-row.copy-flash{animation:copyFlash 1.35s ease}
@keyframes copyFlash{0%{background:#ecfdf5}45%{background:#f0fdf4}100%{background:transparent}}
.prompt-main{min-width:0;text-align:left;background:transparent;border:0;padding:3px 0;color:inherit}
.prompt-title{font-size:15px;font-weight:760;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prompt-meta{display:flex;align-items:center;gap:7px;margin-top:4px;color:var(--muted-2);font-size:11px;min-height:15px}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:2px 7px;background:#f1f5f9;color:#64748b;font-size:10px;font-weight:800}
.badge.active-version{background:var(--accent-soft);color:var(--accent)}
.star{color:#d97706;font-size:12px}
.row-actions{display:flex;align-items:center;gap:4px}
.row-menu-wrap{position:relative}
.context-menu{position:absolute;right:0;top:42px;width:210px;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:80}
.context-menu button{width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:9px 10px;color:var(--text);font-size:13px}
.context-menu button:hover{background:#f8fafc}
.context-menu button.danger{color:var(--danger)}
.context-menu .sep{height:1px;background:var(--border);margin:5px 4px}

.empty{padding:64px 20px;text-align:center;background:#fff;border:1px solid var(--border);border-radius:15px;color:var(--muted)}
.empty strong{display:block;color:var(--text);margin-bottom:7px;font-size:15px}
.empty p{margin:0 0 14px;font-size:13px;line-height:1.6}

.detail-panel{width:var(--detail);flex:0 0 var(--detail);background:#fff;border-left:1px solid var(--border);height:calc(100vh - 64px);position:sticky;top:64px;overflow:auto;z-index:20}
.detail-head{position:sticky;top:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:16px;z-index:4}
.detail-head-row{display:flex;align-items:flex-start;gap:10px}
.detail-title{flex:1;font-size:18px;font-weight:850;letter-spacing:-.02em;line-height:1.35}
.detail-actions{display:flex;gap:7px;margin-top:13px}
.detail-body{padding:18px}
.detail-label{font-size:11px;font-weight:800;color:var(--muted-2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.prompt-body{font:13px/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;white-space:pre-wrap;word-break:break-word;background:#f8fafc;border:1px solid var(--border);border-radius:12px;padding:14px;color:#334155;max-height:48vh;overflow:auto}
.tag-list{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.tag{display:inline-flex;align-items:center;padding:4px 9px;background:#f1f5f9;color:#64748b;border:0;border-radius:999px;font-size:11px;font-weight:700}
.detail-links{margin-top:18px;border-top:1px solid var(--border);padding-top:10px}
.detail-link{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;background:transparent;border-radius:9px;padding:10px;color:var(--text);text-align:left}
.detail-link:hover{background:#f8fafc}
.detail-note{margin-top:10px;color:var(--muted);font-size:12px;line-height:1.5}

.mobile-header,.mobile-tabs,.fab{display:none}

.modal-layer{position:fixed;inset:0;background:rgba(15,23,42,.36);z-index:120;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{width:min(780px,100%);max-height:min(88vh,860px);background:#fff;border-radius:18px;box-shadow:0 24px 80px rgba(15,23,42,.28);display:flex;flex-direction:column;overflow:hidden}
.modal.medium{width:min(620px,100%)}
.modal.small{width:min(440px,100%)}
.modal-head{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);background:#fff;flex-shrink:0}
.modal-title{font-weight:820;font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.editor-save-top{padding:8px 12px;font-size:13px}
.modal-body{padding:18px;overflow:auto;min-height:0}
.modal-foot{display:flex;justify-content:flex-end;gap:9px;padding:12px 16px;border-top:1px solid var(--border);background:#fff;flex-shrink:0}
.field{margin-bottom:17px}
.field label{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;color:#475569;margin-bottom:7px}
.field-hint{font-size:11px;font-weight:500;color:var(--muted-2)}
.field input,.field textarea{width:100%;border:1px solid var(--border-strong);border-radius:11px;padding:11px 12px;color:var(--text);background:#fff;outline:none;font-size:15px}
.field input:focus,.field textarea:focus{border-color:#818cf8;box-shadow:0 0 0 3px rgba(79,70,229,.08)}
.field textarea{font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;min-height:330px;resize:vertical}
.version-source{border:1px solid var(--border);background:#f8fafc;border-radius:11px;padding:10px 12px;margin-bottom:16px;color:var(--muted);font-size:12px}

.history-list{display:flex;flex-direction:column;gap:9px}
.version-card{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#fff}
.compare-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;padding:10px 12px;background:#f8fafc;border:1px solid var(--border);border-radius:12px}
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.compare-pane{min-width:0}.compare-pane pre{white-space:pre-wrap;word-break:break-word;background:#f8fafc;border:1px solid var(--border);padding:12px;border-radius:10px;max-height:52vh;overflow:auto;font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace}.compare-title{font-weight:800;margin-bottom:7px}.star-note{font-size:11px;color:#92400e;margin-top:5px}.backup-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.backup-card{border:1px solid var(--border);border-radius:12px;padding:14px;background:#fff}.backup-card strong{display:block;margin-bottom:6px}.backup-card p{font-size:12px;line-height:1.6;color:var(--muted);margin:0 0 12px}@media(max-width:767px){.compare-grid,.backup-actions{grid-template-columns:1fr}}
.version-top{display:flex;align-items:center;gap:8px;padding:11px 12px;background:#f8fafc}
.version-num{font-weight:850;color:var(--accent);font-size:12px;background:var(--accent-soft);border-radius:999px;padding:3px 8px}
.version-note{flex:1;min-width:0;color:#475569;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.version-date{color:var(--muted-2);font-size:11px}
.version-flags{display:flex;gap:5px;flex-wrap:wrap;padding:0 12px 10px;background:#f8fafc}
.flag{font-size:10px;font-weight:800;border-radius:999px;padding:3px 7px;background:#fff;border:1px solid var(--border);color:var(--muted)}
.flag.live{color:var(--accent);border-color:#c7d2fe;background:#eef2ff}
.flag.starred{color:#b45309;border-color:#fde68a;background:#fffbeb}
.version-toggle{width:100%;border:0;border-top:1px solid var(--border);background:#fff;text-align:left;padding:9px 12px;color:var(--muted);font-size:12px;font-weight:700}
.version-content{border-top:1px solid var(--border);padding:12px}
.version-content pre{margin:0 0 12px;font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;white-space:pre-wrap;word-break:break-word;background:#f8fafc;border-radius:10px;padding:12px;max-height:260px;overflow:auto;color:#334155}
.version-actions{display:flex;gap:7px;flex-wrap:wrap}
.version-actions button{border:1px solid var(--border);background:#fff;border-radius:9px;padding:7px 9px;font-size:12px;font-weight:700;color:#475569}
.version-actions button:hover{background:#f8fafc;color:var(--text)}
.version-actions button.primary-mini{background:var(--accent-soft);color:var(--accent);border-color:#c7d2fe}

.reorder-list{display:flex;flex-direction:column;gap:7px}
.reorder-item{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;border:1px solid var(--border);border-radius:11px;padding:9px 10px;background:#fff}
.reorder-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;font-weight:700}
.reorder-actions{display:flex;gap:5px}
.reorder-actions button{width:34px;height:34px;border:1px solid var(--border);background:#fff;border-radius:8px;color:var(--muted)}

.search-modal-input{position:relative;margin-bottom:14px}
.search-modal-input input{width:100%;height:48px;border:1px solid var(--border-strong);border-radius:12px;padding:0 14px;font-size:16px;outline:none}
.search-section-title{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:850;color:var(--muted-2);margin:15px 2px 7px}
.search-result{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px 8px;border-bottom:1px solid #edf0f4}
.search-result:last-child{border-bottom:0}
.search-result-title{font-weight:720;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-result-meta{font-size:11px;color:var(--muted-2);margin-top:3px}
.search-result-snippet{margin-top:5px;color:var(--muted);font-size:12px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.search-result-snippet mark{background:#fef3c7;color:inherit;padding:0 1px;border-radius:2px}
.diff-summary{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.diff-stat{font-size:11px;font-weight:800;border-radius:999px;padding:4px 8px;background:#f1f5f9;color:#475569}.diff-stat.add{background:#ecfdf5;color:#166534}.diff-stat.del{background:#fef2f2;color:#b91c1c}
.diff-view{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#fff;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.diff-line{display:grid;grid-template-columns:34px minmax(0,1fr);border-bottom:1px solid #f1f5f9}.diff-line:last-child{border-bottom:0}.diff-prefix{padding:4px 8px;text-align:center;color:var(--muted-2);user-select:none}.diff-text{padding:4px 10px;white-space:pre-wrap;word-break:break-word}.diff-line.add{background:#f0fdf4}.diff-line.add .diff-prefix{color:#15803d}.diff-line.del{background:#fef2f2}.diff-line.del .diff-prefix{color:#b91c1c}.diff-line.same{background:#fff}.diff-legend{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.5}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(8px);background:#172033;color:#fff;padding:10px 15px;border-radius:999px;font-size:13px;font-weight:750;z-index:300;opacity:0;pointer-events:none;transition:.18s ease;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:1099px){
  :root{--sidebar:164px;--detail:380px}
  .search-box{width:min(300px,36vw)}
  .detail-panel{position:fixed;right:0;top:64px;box-shadow:-12px 0 40px rgba(15,23,42,.10)}
  .detail-scrim{display:block;position:fixed;inset:64px 0 0 164px;background:rgba(15,23,42,.18);z-index:19}
}

@media (max-width:767px){
  body{background:#fff}
  .app-shell{display:block;min-height:100vh;padding-top:112px}
  .brand,.topbar,.sidebar{display:none}
  .main{display:block}
  .content,.content.with-detail{padding:12px 12px calc(96px + env(safe-area-inset-bottom));overflow:visible}
  .content-head{display:none}
  .mobile-header{display:flex;position:fixed;top:0;left:0;right:0;height:60px;z-index:70;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);align-items:center;padding:0 12px;padding-top:env(safe-area-inset-top)}
  .mobile-brand{font-size:17px;font-weight:850;flex:1}
  .mobile-tabs{display:flex;position:fixed;top:60px;left:0;right:0;height:52px;z-index:69;background:#fff;border-bottom:1px solid var(--border);padding:7px 12px;gap:7px}
  .mobile-tab{flex:1;border:0;border-radius:10px;background:#f8fafc;color:var(--muted);font-weight:750}
  .mobile-tab.active{background:var(--accent-soft);color:var(--accent)}
  .prompt-list{border:0;border-radius:0;box-shadow:none}
  .prompt-row{grid-template-columns:minmax(0,1fr) auto auto;min-height:62px;padding:8px 4px 8px 6px}
  .prompt-title{font-size:15px}
  .copy-btn{min-width:66px;padding:8px 9px;font-size:13px}
  .menu-btn{width:36px}
  .detail-scrim{display:none!important}
  .detail-panel{position:fixed;inset:0;width:auto;height:auto;z-index:100;border-left:0;box-shadow:none;padding-top:env(safe-area-inset-top)}
  .detail-head{padding:10px 11px;border-bottom:1px solid var(--border)}
  .detail-head-row{align-items:center}
  .detail-close-mobile{display:inline-flex!important}
  .detail-close-desktop{display:none!important}
  .detail-title{font-size:16px}
  .detail-actions{margin-top:10px}
  .detail-body{padding:14px}
  .prompt-body{max-height:none}
  .fab{display:flex;position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:48px;height:48px;border-radius:50%;background:var(--accent);color:#fff;border:0;align-items:center;justify-content:center;font-size:25px;box-shadow:0 10px 28px rgba(79,70,229,.28);z-index:72}
  .modal-layer{padding:0;align-items:stretch;background:#fff}
  .modal,.modal.medium,.modal.small{width:100%;max-height:none;height:100%;border-radius:0;box-shadow:none;padding-top:env(safe-area-inset-top)}
  .modal-head{min-height:56px}
  .modal-body{padding:14px 13px 100px}
  .modal-foot{position:fixed;left:0;right:0;bottom:0;padding:11px 12px calc(11px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px rgba(15,23,42,.06)}
  .field textarea{min-height:48vh;resize:none}
  .toast{bottom:calc(88px + env(safe-area-inset-bottom));max-width:90vw;text-align:center}
}
</style>
</head>
<body>
<div id="app" class="app-shell">
  <div class="brand">Prompt Vault</div>

  <header class="topbar">
    <div class="topbar-title" id="desktop-view-title">今使う</div>
    <div class="topbar-spacer"></div>
    <div class="search-box">
      <input id="desktop-search" type="search" placeholder="タイトル・本文・タグを検索" aria-label="プロンプトを検索">
      <button class="search-clear hidden" id="desktop-search-clear" aria-label="検索をクリア">×</button>
    </div>
    <button class="primary-btn" id="new-desktop">＋ 新規作成</button>
  </header>

  <aside class="sidebar">
    <button class="nav-btn" data-view="current"><span class="nav-icon">▣</span>今使う<span class="nav-count" id="current-count"></span></button>
    <button class="nav-btn" data-view="all"><span class="nav-icon">☰</span>すべて<span class="nav-count" id="all-count"></span></button>
    <div class="side-section">補助</div>
    <button class="side-link" id="recent-link">最近使った</button>
    <button class="side-link" id="reorder-link">並び替え</button>
    <button class="side-link" id="data-link">バックアップ</button>
  </aside>

  <main class="main">
    <section class="content" id="content">
      <div class="content-head">
        <div>
          <h1 id="content-title">今使う</h1>
          <div class="content-sub" id="content-subtitle">現在の道具箱</div>
        </div>
        <div class="spacer"></div>
        <button class="small-btn hidden" id="clear-filter-btn">絞り込み解除</button>
      </div>
      <div id="list-host"></div>
    </section>
    <div class="detail-scrim hidden" id="detail-scrim"></div>
    <aside class="detail-panel hidden" id="detail-panel" aria-label="プロンプト詳細"></aside>
  </main>

  <header class="mobile-header">
    <div class="mobile-brand">Prompt Vault</div>
    <button class="icon-btn" id="mobile-search-btn" aria-label="検索">⌕</button>
  </header>
  <nav class="mobile-tabs">
    <button class="mobile-tab" data-view="current">今使う</button>
    <button class="mobile-tab" data-view="all">すべて</button>
  </nav>
  <button class="fab" id="new-mobile" aria-label="新規プロンプト">＋</button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="overlay-host"></div>

<script>
(() => {
'use strict';

const STORAGE_KEY = 'pv2';
const BACKUP_KEY = 'pv2_backup_pre_v2';
const CORRUPT_PREFIX = 'pv2_corrupt_';
const state = {
  prompts: [],
  view: 'current',
  selectedId: null,
  searchQuery: '',
  tagFilter: null,
  openMenuId: null,
  startupNotice: '',
  migrated: false,
  modal: null,
  modalDirty: false
};

const $ = (id) => document.getElementById(id);
const nowISO = () => new Date().toISOString();
const todayISO = () => new Date().toISOString().slice(0,10);
const isMobile = () => window.matchMedia('(max-width: 767px)').matches;
const uid = () => `${Date.now()}-${Math.random().toString(36).slice(2,9)}`;

function escapeHTML(value='') {
  return String(value).replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
}
function formatDate(value) {
  if (!value) return '';
  const d = new Date(value);
  if (Number.isNaN(d.getTime())) return String(value);
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
}
function normalizedTags(value) {
  if (Array.isArray(value)) return value.map(v => String(v).trim()).filter(Boolean);
  return String(value || '').split(/[,、\n]+/).map(v => v.trim()).filter(Boolean);
}
function versionNumber(v) { return Number(v?.version) || 1; }
function latestVersion(prompt) {
  return [...prompt.versions].sort((a,b) => versionNumber(b)-versionNumber(a))[0];
}
function activeVersion(prompt) {
  return prompt.versions.find(v => versionNumber(v) === Number(prompt.activeVersion)) || latestVersion(prompt);
}
function nextVersionNumber(prompt) {
  return Math.max(0, ...prompt.versions.map(versionNumber)) + 1;
}
function promptById(id) { return state.prompts.find(p => String(p.id) === String(id)); }
function currentSet() {
  return state.prompts.filter(p => p.inCurrentSet).sort((a,b) => {
    const ao = Number.isFinite(Number(a.currentOrder)) ? Number(a.currentOrder) : 999999;
    const bo = Number.isFinite(Number(b.currentOrder)) ? Number(b.currentOrder) : 999999;
    return ao - bo || state.prompts.indexOf(a) - state.prompts.indexOf(b);
  });
}
function recentPrompts(limit=20) {
  return state.prompts.filter(p => p.lastUsedAt).sort((a,b) => String(b.lastUsedAt).localeCompare(String(a.lastUsedAt))).slice(0,limit);
}

function loadData() {
  let raw = null;
  try { raw = localStorage.getItem(STORAGE_KEY); }
  catch (_) {
    state.prompts = [];
    state.startupNotice = 'ブラウザの保存領域にアクセスできません。この状態ではデータを保存できません。';
    return;
  }
  if (!raw) {
    state.prompts = [];
    return;
  }
  let parsed;
  try {
    parsed = JSON.parse(raw);
    if (!Array.isArray(parsed)) throw new Error('保存データの形式が配列ではありません');
  } catch (err) {
    const backupName = `${CORRUPT_PREFIX}${Date.now()}`;
    try { localStorage.setItem(backupName, raw); } catch (_) {}
    state.prompts = [];
    state.startupNotice = `保存データを読み込めなかったため、破損データを ${backupName} に退避しました。`;
    return;
  }

  const needsMigration = parsed.some(p =>
    !Object.prototype.hasOwnProperty.call(p,'inCurrentSet') ||
    !Object.prototype.hasOwnProperty.call(p,'activeVersion') ||
    !Object.prototype.hasOwnProperty.call(p,'lastUsedAt') ||
    !Object.prototype.hasOwnProperty.call(p,'useCount') ||
    !Array.isArray(p.versions) || p.versions.some(v => !Object.prototype.hasOwnProperty.call(v,'starred'))
  );

  if (needsMigration) {
    try {
      if (!localStorage.getItem(BACKUP_KEY)) localStorage.setItem(BACKUP_KEY, raw);
    } catch (_) {}
  }

  state.prompts = parsed.map((p, idx) => migratePrompt(p, idx));
  state.migrated = needsMigration;
  if (needsMigration) {
    saveData();
    state.startupNotice = '既存データをPrompt Vault 2形式へ安全に移行しました。旧データのバックアップも保存しています。';
  }
}

function migratePrompt(input, idx=0) {
  const p = input && typeof input === 'object' ? input : {};
  const versions = Array.isArray(p.versions) && p.versions.length ? p.versions : [{version:1, body:'', note:'', createdAt:todayISO()}];
  const normalizedVersions = versions.map((v, vi) => ({
    ...v,
    version: versionNumber(v) || vi+1,
    body: String(v?.body ?? ''),
    note: String(v?.note ?? ''),
    createdAt: v?.createdAt || todayISO(),
    starred: Boolean(v?.starred),
    starNote: String(v?.starNote ?? '')
  })).sort((a,b) => versionNumber(a)-versionNumber(b));
  const maxVersion = Math.max(...normalizedVersions.map(versionNumber));
  return {
    ...p,
    id: p.id != null ? String(p.id) : uid(),
    title: String(p.title || '無題のプロンプト'),
    tags: normalizedTags(p.tags),
    inCurrentSet: Boolean(p.inCurrentSet),
    currentOrder: p.currentOrder == null ? idx : Number(p.currentOrder),
    activeVersion: normalizedVersions.some(v => versionNumber(v) === Number(p.activeVersion)) ? Number(p.activeVersion) : maxVersion,
    lastUsedAt: p.lastUsedAt || null,
    useCount: Number(p.useCount) || 0,
    versions: normalizedVersions
  };
}

function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.prompts));
    return true;
  } catch (err) {
    showToast('保存に失敗しました。ブラウザの保存容量を確認してください。', 3500);
    return false;
  }
}

function showToast(message, duration=1900) {
  const t = $('toast');
  t.textContent = message;
  t.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => t.classList.remove('show'), duration);
}

async function copyToClipboard(text) {
  // 1) HTTPS / localhost では標準 Clipboard API を優先。
  if (navigator.clipboard && window.isSecureContext) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch (_) {}
  }
  // 2) Android の content:// や一部 WebView 向けの互換フォールバック。
  let ta = null;
  try {
    ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly','');
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    ta.style.top = '0';
    ta.style.opacity = '0.01';
    document.body.appendChild(ta);
    ta.focus({preventScroll:true});
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    const ok = document.execCommand && document.execCommand('copy');
    if (ok) return true;
  } catch (_) {
  } finally {
    if (ta) ta.remove();
  }
  return false;
}

async function copyPrompt(id, versionNum=null, button=null) {
  const p = promptById(id);
  if (!p) return;
  const v = versionNum == null ? activeVersion(p) : p.versions.find(x => versionNumber(x) === Number(versionNum));
  if (!v) return;
  const ok = await copyToClipboard(v.body);
  if (!ok) {
    showToast('コピーできませんでした。本文を開いて手動でコピーしてください。', 3200);
    return;
  }
  p.lastUsedAt = nowISO();
  p.useCount = (Number(p.useCount)||0) + 1;
  saveData();
  if (button) {
    const old = button.textContent;
    button.textContent = 'コピー済み';
    button.classList.add('copied');
    setTimeout(() => { button.textContent = old; button.classList.remove('copied'); }, 1300);
  }
  const row = document.querySelector(`.prompt-row[data-id="${CSS.escape(String(id))}"]`);
  if (row) { row.classList.remove('copy-flash'); void row.offsetWidth; row.classList.add('copy-flash'); setTimeout(() => row.classList.remove('copy-flash'), 1400); }
  showToast(versionNum == null ? `「${p.title}」をコピーしました` : `「${p.title}」v${versionNum} をコピーしました`);
}

function setView(view) {
  state.view = view === 'all' ? 'all' : 'current';
  state.searchQuery = '';
  state.tagFilter = null;
  $('desktop-search').value = '';
  $('desktop-search-clear').classList.add('hidden');
  closeDetail();
  render();
}

function getVisiblePrompts() {
  const q = state.searchQuery.trim().toLocaleLowerCase('ja');
  // 検索は「今使う」に限定せず、保管庫全体を対象にする。
  let list = q ? [...state.prompts] : (state.view === 'current' ? currentSet() : [...state.prompts]);
  if (state.tagFilter) list = list.filter(p => p.tags.includes(state.tagFilter));
  if (q) {
    const scored = [];
    for (const p of list) {
      const title = p.title.toLocaleLowerCase('ja');
      const tags = p.tags.join(' ').toLocaleLowerCase('ja');
      const bodies = p.versions.map(v => v.body).join('\n').toLocaleLowerCase('ja');
      let score = 0;
      if (title === q) score = 100;
      else if (title.startsWith(q)) score = 80;
      else if (title.includes(q)) score = 60;
      else if (tags.includes(q)) score = 30;
      else if (bodies.includes(q)) score = 10;
      if (score) scored.push({p,score});
    }
    scored.sort((a,b) => b.score-a.score || list.indexOf(a.p)-list.indexOf(b.p));
    list = scored.map(x => x.p);
  }
  return list;
}

function render() {
  const currentCount = currentSet().length;
  $('current-count').textContent = currentCount || '';
  $('all-count').textContent = state.prompts.length || '';
  document.querySelectorAll('[data-view]').forEach(el => el.classList.toggle('active', el.dataset.view === state.view));
  const title = state.view === 'current' ? '今使う' : 'すべて';
  $('desktop-view-title').textContent = title;
  $('content-title').textContent = title;
  $('content-subtitle').textContent = state.view === 'current' ? '現在の道具箱' : `${state.prompts.length}件のプロンプト`;
  $('clear-filter-btn').classList.toggle('hidden', !state.tagFilter);
  renderList();
  renderDetail();
}

function renderList() {
  const host = $('list-host');
  const list = getVisiblePrompts();
  if (!list.length) {
    if (state.searchQuery || state.tagFilter) {
      host.innerHTML = `<div class="empty"><strong>見つかりませんでした</strong><p>検索語や絞り込みを変えてください。</p></div>`;
    } else if (state.view === 'current') {
      host.innerHTML = `<div class="empty"><strong>今使うプロンプトはまだありません</strong><p>「すべて」から、今よく使うプロンプトを道具箱へ追加できます。</p><button class="secondary-btn" data-action="goto-all">すべてを見る</button></div>`;
    } else {
      host.innerHTML = `<div class="empty"><strong>プロンプトがまだありません</strong><p>最初のプロンプトを登録すると、ここからすぐコピーできるようになります。</p><button class="primary-btn" data-action="new">＋ 新規作成</button></div>`;
    }
    return;
  }
  host.innerHTML = `<div class="prompt-list">${list.map(renderPromptRow).join('')}</div>`;
}

function renderPromptRow(p) {
  const av = activeVersion(p);
  const latest = latestVersion(p);
  const starred = av?.starred ? `<span class="star" title="良かった版">★</span>` : '';
  const different = versionNumber(av) !== versionNumber(latest);
  const meta = `<span class="badge ${different?'active-version':''}">v${versionNumber(av)}${different?' 使用中':''}</span>${starred}<span>${p.useCount ? `${p.useCount}回コピー` : ''}</span>`;
  const menuOpen = state.openMenuId === p.id;
  return `
    <div class="prompt-row" data-id="${escapeHTML(p.id)}">
      <button class="prompt-main" data-action="detail" data-id="${escapeHTML(p.id)}" title="詳細を開く">
        <div class="prompt-title">${escapeHTML(p.title)}</div>
        <div class="prompt-meta">${meta}</div>
      </button>
      <button class="copy-btn" data-action="copy" data-id="${escapeHTML(p.id)}">コピー</button>
      <div class="row-menu-wrap">
        <button class="menu-btn" data-action="menu" data-id="${escapeHTML(p.id)}" aria-label="${escapeHTML(p.title)}のメニュー">⋯</button>
        ${menuOpen ? renderContextMenu(p) : ''}
      </div>
    </div>`;
}

function renderContextMenu(p) {
  return `<div class="context-menu" role="menu">
    <button data-action="detail" data-id="${escapeHTML(p.id)}">詳細を見る</button>
    <button data-action="edit" data-id="${escapeHTML(p.id)}">編集</button>
    <button data-action="toggle-current" data-id="${escapeHTML(p.id)}">${p.inCurrentSet ? '今使うから外す' : '今使うに追加'}</button>
    <button data-action="history" data-id="${escapeHTML(p.id)}">履歴を見る</button>
    <div class="sep"></div>
    <button data-action="reorder">並び替え</button>
    <button class="danger" data-action="delete" data-id="${escapeHTML(p.id)}">削除</button>
  </div>`;
}

function openDetail(id) {
  if (!promptById(id)) return;
  state.selectedId = id;
  state.openMenuId = null;
  render();
}
function closeDetail() {
  state.selectedId = null;
  $('detail-panel').classList.add('hidden');
  $('detail-scrim').classList.add('hidden');
  $('content').classList.remove('with-detail');
}
function renderDetail() {
  const panel = $('detail-panel');
  const p = promptById(state.selectedId);
  if (!p) {
    panel.classList.add('hidden');
    $('detail-scrim').classList.add('hidden');
    $('content').classList.remove('with-detail');
    return;
  }
  const av = activeVersion(p);
  const latest = latestVersion(p);
  const latestLabel = versionNumber(av) !== versionNumber(latest) ? `使用版 v${versionNumber(av)} ・ 最新 v${versionNumber(latest)}` : `使用版 v${versionNumber(av)} ・ 最新`;
  panel.innerHTML = `
    <div class="detail-head">
      <div class="detail-head-row">
        <button class="icon-btn detail-close-mobile hidden" data-action="close-detail" aria-label="詳細を閉じる">←</button>
        <div class="detail-title">${escapeHTML(p.title)}</div>
        <button class="icon-btn detail-close-desktop" data-action="close-detail" aria-label="詳細を閉じる">×</button>
      </div>
      <div class="detail-actions">
        <button class="copy-btn" data-action="copy" data-id="${escapeHTML(p.id)}">コピー</button>
        <button class="secondary-btn" data-action="edit" data-id="${escapeHTML(p.id)}">編集</button>
        <button class="secondary-btn" data-action="history" data-id="${escapeHTML(p.id)}">履歴</button>
      </div>
    </div>
    <div class="detail-body">
      <div class="detail-label">${escapeHTML(latestLabel)}${av.starred ? ' ・ ★' : ''}</div>
      <div class="prompt-body">${escapeHTML(av.body)}</div>
      ${p.tags.length ? `<div class="tag-list">${p.tags.map(t => `<button class="tag" data-action="filter-tag" data-tag="${escapeHTML(t)}">${escapeHTML(t)}</button>`).join('')}</div>` : ''}
      ${av.note ? `<div class="detail-note">メモ：${escapeHTML(av.note)}</div>` : ''}
      <div class="detail-links">
        <button class="detail-link" data-action="toggle-current" data-id="${escapeHTML(p.id)}"><span>${p.inCurrentSet ? '今使うから外す' : '今使うに追加'}</span><span>›</span></button>
        <button class="detail-link" data-action="new-version" data-id="${escapeHTML(p.id)}" data-version="${versionNumber(av)}"><span>この版から新バージョンを作る</span><span>›</span></button>
        <button class="detail-link" data-action="history" data-id="${escapeHTML(p.id)}"><span>バージョン履歴</span><span>${p.versions.length} ›</span></button>
      </div>
    </div>`;
  panel.classList.remove('hidden');
  $('content').classList.add('with-detail');
  if (!isMobile() && window.innerWidth < 1100) $('detail-scrim').classList.remove('hidden');
  else $('detail-scrim').classList.add('hidden');
}

function toggleCurrent(id) {
  const p = promptById(id);
  if (!p) return;
  p.inCurrentSet = !p.inCurrentSet;
  if (p.inCurrentSet) {
    const set = currentSet().filter(x => x.id !== p.id);
    p.currentOrder = set.length ? Math.max(...set.map(x => Number(x.currentOrder)||0)) + 1 : 0;
  } else {
    p.currentOrder = null;
  }
  normalizeCurrentOrder();
  saveData();
  state.openMenuId = null;
  render();
  showToast(p.inCurrentSet ? '今使うに追加しました' : '今使うから外しました');
}
function normalizeCurrentOrder() {
  currentSet().forEach((p,i) => p.currentOrder = i);
}

function deletePrompt(id) {
  const p = promptById(id);
  if (!p) return;
  if (!confirm(`「${p.title}」を削除しますか？\nこの操作は元に戻せません。`)) return;
  state.prompts = state.prompts.filter(x => x.id !== id);
  if (state.selectedId === id) state.selectedId = null;
  state.openMenuId = null;
  saveData();
  render();
  showToast('削除しました');
}

function openModal(kind, html, {size='', onOpen=null}={}) {
  closeModal(true);
  state.modal = kind;
  state.modalDirty = false;
  const host = $('overlay-host');
  host.innerHTML = `<div class="modal-layer" id="modal-layer"><div class="modal ${size}">${html}</div></div>`;
  host.querySelector('#modal-layer').addEventListener('mousedown', (e) => {
    if (e.target.id === 'modal-layer') closeModal();
  });
  if (onOpen) requestAnimationFrame(onOpen);
}
function closeModal(force=false) {
  if (!state.modal) return true;
  if (!force && state.modalDirty && !confirm('未保存の変更があります。破棄して閉じますか？')) return false;
  $('overlay-host').innerHTML = '';
  state.modal = null;
  state.modalDirty = false;
  return true;
}

function openNewPrompt() {
  openPromptEditor(null);
}
function openPromptEditor(id) {
  const p = id ? promptById(id) : null;
  const base = p ? activeVersion(p) : null;
  const html = `
    <div class="modal-head"><button class="icon-btn" data-modal-close aria-label="閉じる">←</button><div class="modal-title">${p ? 'プロンプトを編集' : '新規プロンプト'}</div><button class="primary-btn editor-save-top" id="editor-save-top">保存</button></div>
    <div class="modal-body">
      <div class="field"><label>タイトル</label><input id="edit-title" value="${escapeHTML(p?.title || '')}" placeholder="例：4コマ漫画ネーム作成"></div>
      <div class="field"><label>タグ <span class="field-hint">任意・カンマ区切り</span></label><input id="edit-tags" value="${escapeHTML(p?.tags.join(', ') || '')}" placeholder="例：NotebookLM, 画像生成"></div>
      ${p ? `<div class="version-source">本文を変更して保存すると、既存版を上書きせず <strong>v${nextVersionNumber(p)}</strong> として追加します。現在の使用版 v${versionNumber(base)} を元に編集しています。</div>` : ''}
      <div class="field"><label>プロンプト本文</label><textarea id="edit-body" placeholder="プロンプトを入力…">${escapeHTML(base?.body || '')}</textarea></div>
      <div class="field"><label>変更メモ <span class="field-hint">任意</span></label><input id="edit-note" value="" placeholder="何を変えたか"></div>
    </div>
    <div class="modal-foot"><button class="secondary-btn" data-modal-close>キャンセル</button><button class="primary-btn" id="editor-save">保存</button></div>`;
  openModal(p ? 'edit' : 'new', html, {onOpen: () => $('edit-title').focus()});
  ['edit-title','edit-tags','edit-body','edit-note'].forEach(fid => $(fid).addEventListener('input', () => state.modalDirty = true));
  $('editor-save').addEventListener('click', () => savePromptEditor(id));
  $('editor-save-top').addEventListener('click', () => savePromptEditor(id));
}
function savePromptEditor(id) {
  const title = $('edit-title').value.trim();
  const tags = normalizedTags($('edit-tags').value);
  const body = $('edit-body').value.trim();
  const note = $('edit-note').value.trim();
  if (!title || !body) {
    showToast('タイトルと本文は必須です');
    return;
  }
  if (!id) {
    const newPrompt = {
      id: uid(), title, tags, inCurrentSet:false, currentOrder:null, activeVersion:1,
      lastUsedAt:null, useCount:0,
      versions:[{version:1, body, note:note || '初版', createdAt:todayISO(), starred:false,starNote:''}]
    };
    state.prompts.push(newPrompt);
    saveData();
    state.modalDirty = false;
    closeModal(true);
    state.view = 'all';
    state.selectedId = newPrompt.id;
    render();
    showToast('保存しました');
    return;
  }
  const p = promptById(id);
  if (!p) return;
  const base = activeVersion(p);
  const bodyChanged = body !== base.body;
  p.title = title;
  p.tags = tags;
  if (bodyChanged) {
    const num = nextVersionNumber(p);
    p.versions.push({version:num, body, note:note || `v${num}`, createdAt:todayISO(), starred:false});
    p.activeVersion = num;
  } else if (note) {
    base.note = note;
  }
  saveData();
  state.modalDirty = false;
  closeModal(true);
  render();
  showToast(bodyChanged ? `v${p.activeVersion} を追加し、使用版にしました` : '更新しました');
}

function openNewVersion(id, baseVersionNum=null) {
  const p = promptById(id);
  if (!p) return;
  const base = baseVersionNum == null ? activeVersion(p) : p.versions.find(v => versionNumber(v) === Number(baseVersionNum));
  if (!base) return;
  const next = nextVersionNumber(p);
  const html = `
    <div class="modal-head"><button class="icon-btn" data-modal-close aria-label="閉じる">←</button><div class="modal-title">新バージョンを作成</div></div>
    <div class="modal-body">
      <div class="version-source"><strong>${escapeHTML(p.title)}</strong><br>v${versionNumber(base)} を元に、新しい v${next} を作ります。</div>
      <div class="field"><label>プロンプト本文</label><textarea id="version-body">${escapeHTML(base.body)}</textarea></div>
      <div class="field"><label>変更メモ <span class="field-hint">任意</span></label><input id="version-note" placeholder="何を変えたか"></div>
    </div>
    <div class="modal-foot"><button class="secondary-btn" data-modal-close>キャンセル</button><button class="primary-btn" id="version-save">v${next} を保存</button></div>`;
  openModal('new-version', html, {onOpen: () => $('version-body').focus()});
  ['version-body','version-note'].forEach(fid => $(fid).addEventListener('input', () => state.modalDirty = true));
  $('version-save').addEventListener('click', () => {
    const body = $('version-body').value.trim();
    const note = $('version-note').value.trim();
    if (!body) return showToast('本文は必須です');
    p.versions.push({version:next,body,note:note || `v${next}`,createdAt:todayISO(),starred:false,starNote:''});
    p.activeVersion = next;
    saveData();
    state.modalDirty = false;
    closeModal(true);
    render();
    showToast(`v${next} を追加し、使用版にしました`);
  });
}

function openHistory(id) {
  const p = promptById(id);
  if (!p) return;
  const versions = [...p.versions].sort((a,b) => versionNumber(b)-versionNumber(a));
  const html = `
    <div class="modal-head"><button class="icon-btn" data-modal-close aria-label="閉じる">←</button><div class="modal-title">${escapeHTML(p.title)} — 履歴</div></div>
    <div class="modal-body"><div class="compare-toolbar"><strong>版を比較</strong><span class="detail-note" style="margin:0">2つ選んで差分を確認できます</span><button class="secondary-btn" data-action="compare-selected" data-id="${escapeHTML(p.id)}">比較する</button></div><div class="history-list">${versions.map(v => renderVersionCard(p,v)).join('')}</div></div>
    <div class="modal-foot"><button class="secondary-btn" data-modal-close>閉じる</button></div>`;
  openModal('history', html);
}
function renderVersionCard(p,v) {
  const latest = latestVersion(p);
  const isLatest = versionNumber(v) === versionNumber(latest);
  const isActive = versionNumber(v) === Number(p.activeVersion);
  return `<div class="version-card" data-version-card="${versionNumber(v)}">
    <div class="version-top"><input type="checkbox" class="compare-check" value="${versionNumber(v)}" aria-label="v${versionNumber(v)}を比較対象にする"><span class="version-num">v${versionNumber(v)}</span><span class="version-note">${escapeHTML(v.note || '')}</span><span class="version-date">${escapeHTML(formatDate(v.createdAt))}</span></div>
    <div class="version-flags">${isLatest?'<span class="flag">最新</span>':''}${isActive?'<span class="flag live">使用中</span>':''}${v.starred?'<span class="flag starred">★ 良かった版</span>':''}</div>${v.starNote?`<div class="star-note">★ ${escapeHTML(v.starNote)}</div>`:''}
    <button class="version-toggle" data-action="toggle-version" data-id="${escapeHTML(p.id)}" data-version="${versionNumber(v)}">本文と操作を表示</button>
    <div class="version-content hidden" id="vc-${escapeHTML(p.id)}-${versionNumber(v)}">
      <pre>${escapeHTML(v.body)}</pre>
      <div class="version-actions">
        <button class="primary-mini" data-action="copy-version" data-id="${escapeHTML(p.id)}" data-version="${versionNumber(v)}">コピー</button>
        ${isActive?'':`<button data-action="set-active-version" data-id="${escapeHTML(p.id)}" data-version="${versionNumber(v)}">使用版にする</button>`}
        <button data-action="toggle-star" data-id="${escapeHTML(p.id)}" data-version="${versionNumber(v)}">${v.starred?'★を外す':'★を付ける'}</button>${v.starred?`<button data-action="star-note" data-id="${escapeHTML(p.id)}" data-version="${versionNumber(v)}">★メモ</button>`:''}
        <button data-action="new-version" data-id="${escapeHTML(p.id)}" data-version="${versionNumber(v)}">この版から作る</button>
      </div>
    </div>
  </div>`;
}

function setActiveVersion(id, num) {
  const p = promptById(id);
  if (!p || !p.versions.some(v => versionNumber(v) === Number(num))) return;
  p.activeVersion = Number(num);
  saveData();
  openHistory(id);
  render();
  showToast(`v${num} を使用版にしました`);
}
function toggleStar(id, num) {
  const p = promptById(id);
  const v = p?.versions.find(x => versionNumber(x) === Number(num));
  if (!v) return;
  v.starred = !v.starred;
  saveData();
  openHistory(id);
  render();
  showToast(v.starred ? `v${num} に★を付けました` : `v${num} の★を外しました`);
}

function editStarNote(id, num) {
  const p = promptById(id); const v = p?.versions.find(x => versionNumber(x) === Number(num));
  if (!v) return;
  const html = `<div class="modal-head"><div class="modal-title">v${num} の★メモ</div><button class="icon-btn" data-modal-close>×</button></div><div class="modal-body"><div class="field"><label>なぜ良かったか <span class="field-hint">任意・短く</span></label><input id="star-note-input" maxlength="120" value="${escapeHTML(v.starNote||'')}" placeholder="例：画像の安定性が高かった"></div></div><div class="modal-foot"><button class="secondary-btn" data-modal-close>キャンセル</button><button class="primary-btn" id="star-note-save">保存</button></div>`;
  openModal('star-note', html, {size:'small',onOpen:()=>$('star-note-input').focus()});
  $('star-note-save').addEventListener('click',()=>{v.starNote=$('star-note-input').value.trim();saveData();closeModal(true);openHistory(id);showToast('★メモを保存しました');});
}
function splitLines(text) {
  return String(text ?? '').replace(/\r\n?/g,'\n').split('\n');
}
function buildLineDiff(aText,bText) {
  const a=splitLines(aText), b=splitLines(bText);
  const n=a.length,m=b.length;
  const dp=Array.from({length:n+1},()=>new Uint32Array(m+1));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const out=[]; let i=0,j=0;
  while(i<n && j<m){
    if(a[i]===b[j]){out.push({type:'same',text:a[i]});i++;j++;}
    else if(dp[i+1][j]>=dp[i][j+1]){out.push({type:'del',text:a[i++]});}
    else{out.push({type:'add',text:b[j++]});}
  }
  while(i<n) out.push({type:'del',text:a[i++]});
  while(j<m) out.push({type:'add',text:b[j++]});
  return out;
}
function renderUnifiedDiff(a,b){
  const rows=buildLineDiff(a.body,b.body);
  const added=rows.filter(r=>r.type==='add').length, removed=rows.filter(r=>r.type==='del').length;
  return `<div class="diff-summary"><span class="diff-stat">v${versionNumber(a)} → v${versionNumber(b)}</span><span class="diff-stat add">＋${added}行</span><span class="diff-stat del">－${removed}行</span></div><div class="diff-view">${rows.map(r=>`<div class="diff-line ${r.type}"><div class="diff-prefix">${r.type==='add'?'+':r.type==='del'?'−':' '}</div><div class="diff-text">${escapeHTML(r.text)||'&nbsp;'}</div></div>`).join('')}</div><div class="diff-legend">緑＝追加、赤＝削除。変更された行は「削除＋追加」として表示します。</div>`;
}
function snippetForQuery(p,q){
  const needle=String(q||'').toLocaleLowerCase('ja');
  for(const v of p.versions){
    const body=String(v.body||''); const low=body.toLocaleLowerCase('ja'); const at=low.indexOf(needle);
    if(at>=0){
      const start=Math.max(0,at-34), end=Math.min(body.length,at+needle.length+54);
      const raw=(start>0?'…':'')+body.slice(start,end).replace(/\s+/g,' ')+(end<body.length?'…':'');
      const esc=escapeHTML(raw); const target=escapeHTML(body.slice(at,at+needle.length));
      return target ? esc.replace(target,`<mark>${target}</mark>`) : esc;
    }
  }
  return '';
}
function compareSelected(id) {
  const nums=[...document.querySelectorAll('.compare-check:checked')].map(x=>Number(x.value));
  if(nums.length!==2) return showToast('比較する版を2つ選んでください');
  const p=promptById(id); if(!p)return;
  const vs=nums.map(n=>p.versions.find(v=>versionNumber(v)===n)).filter(Boolean);
  if(vs.length!==2)return;
  const [a,b]=vs.sort((x,y)=>versionNumber(x)-versionNumber(y));
  const html=`<div class="modal-head"><button class="icon-btn" data-modal-close>←</button><div class="modal-title">${escapeHTML(p.title)} — v${versionNumber(a)} → v${versionNumber(b)}</div></div><div class="modal-body">${renderUnifiedDiff(a,b)}</div><div class="modal-foot"><button class="secondary-btn" data-modal-close>閉じる</button></div>`;
  openModal('compare',html);
}
function downloadBackup(){
  const payload={app:'Prompt Vault 2.2',exportedAt:nowISO(),storageKey:STORAGE_KEY,prompts:state.prompts};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}); const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url;a.download=`prompt-vault-backup-${todayISO()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);showToast('バックアップを書き出しました');
}
function openBackup(){
 const html=`<div class="modal-head"><button class="icon-btn" data-modal-close>←</button><div class="modal-title">バックアップ</div></div><div class="modal-body"><div class="backup-actions"><div class="backup-card"><strong>書き出す</strong><p>全プロンプト・履歴・今使う・使用版などをJSONファイルに保存します。</p><button class="primary-btn" id="export-data">バックアップを書き出す</button></div><div class="backup-card"><strong>読み込む</strong><p>Prompt VaultのJSONバックアップを読み込みます。現在データは自動退避してから置き換えます。</p><input id="import-file" type="file" accept="application/json,.json"></div></div></div><div class="modal-foot"><button class="secondary-btn" data-modal-close>閉じる</button></div>`;
 openModal('backup',html,{size:'medium'});$('export-data').addEventListener('click',downloadBackup);$('import-file').addEventListener('change',importBackupFile);
}
async function importBackupFile(e){
 const file=e.target.files?.[0];if(!file)return;try{const obj=JSON.parse(await file.text());const arr=Array.isArray(obj)?obj:Array.isArray(obj.prompts)?obj.prompts:null;if(!arr)throw new Error();
 if(!confirm(`${arr.length}件のバックアップを読み込みます。現在のデータは退避されます。続けますか？`))return;
 localStorage.setItem(`pv2_backup_before_import_${Date.now()}`,JSON.stringify(state.prompts));state.prompts=arr.map((p,i)=>migratePrompt(p,i));saveData();closeModal(true);state.view=currentSet().length?'current':'all';state.selectedId=null;render();showToast(`${arr.length}件を読み込みました`,3000);
 }catch(_){showToast('バックアップを読み込めませんでした',3200);}
}

function openReorder() {
  const usingCurrent = state.view === 'current';
  const list = usingCurrent ? currentSet() : [...state.prompts];
  const html = `
    <div class="modal-head"><button class="icon-btn" data-modal-close aria-label="閉じる">←</button><div class="modal-title">${usingCurrent?'今使う':'すべて'}を並び替え</div></div>
    <div class="modal-body"><div class="reorder-list">${list.map((p,i) => `
      <div class="reorder-item"><div class="reorder-title">${escapeHTML(p.title)}</div><div class="reorder-actions">
        <button data-action="reorder-up" data-id="${escapeHTML(p.id)}" ${i===0?'disabled':''} aria-label="上へ">↑</button>
        <button data-action="reorder-down" data-id="${escapeHTML(p.id)}" ${i===list.length-1?'disabled':''} aria-label="下へ">↓</button>
      </div></div>`).join('')}</div></div>
    <div class="modal-foot"><button class="secondary-btn" data-modal-close>完了</button></div>`;
  openModal('reorder', html, {size:'medium'});
}
function movePrompt(id, direction) {
  if (state.view === 'current') {
    const list = currentSet();
    const idx = list.findIndex(p => p.id === id);
    const target = idx + direction;
    if (idx < 0 || target < 0 || target >= list.length) return;
    [list[idx].currentOrder, list[target].currentOrder] = [list[target].currentOrder, list[idx].currentOrder];
  } else {
    const idx = state.prompts.findIndex(p => p.id === id);
    const target = idx + direction;
    if (idx < 0 || target < 0 || target >= state.prompts.length) return;
    [state.prompts[idx], state.prompts[target]] = [state.prompts[target], state.prompts[idx]];
  }
  saveData();
  render();
  openReorder();
}

function openRecent() {
  const list = recentPrompts(30);
  const html = `
    <div class="modal-head"><button class="icon-btn" data-modal-close aria-label="閉じる">←</button><div class="modal-title">最近使った</div></div>
    <div class="modal-body">${list.length ? list.map(p => `
      <div class="search-result"><button class="prompt-main" data-action="detail-modal" data-id="${escapeHTML(p.id)}"><div class="search-result-title">${escapeHTML(p.title)}</div><div class="search-result-meta">${escapeHTML(formatDate(p.lastUsedAt))} ・ ${p.useCount}回コピー</div></button><button class="copy-btn" data-action="copy" data-id="${escapeHTML(p.id)}">コピー</button></div>`).join('') : '<div class="empty"><strong>まだ使用履歴がありません</strong><p>一覧からコピーすると、ここに最近使ったものが表示されます。</p></div>'}</div>
    <div class="modal-foot"><button class="secondary-btn" data-modal-close>閉じる</button></div>`;
  openModal('recent', html, {size:'medium'});
}

function openSearchModal() {
  const recent = recentPrompts(5);
  const html = `
    <div class="modal-head"><div class="modal-title">検索</div><button class="icon-btn" data-modal-close aria-label="閉じる">×</button></div>
    <div class="modal-body">
      <div class="search-modal-input"><input id="mobile-search-input" type="search" placeholder="タイトル・本文・タグを検索" autocomplete="off"></div>
      <div id="mobile-search-results">${renderRecentSearchSeed(recent)}</div>
    </div>`;
  openModal('search', html, {size:'medium',onOpen:() => $('mobile-search-input').focus()});
  $('mobile-search-input').addEventListener('input', renderMobileSearchResults);
}
function renderRecentSearchSeed(list) {
  if (!list.length) return '<div class="search-section-title">検索</div><div class="detail-note">タイトル・本文・タグから探せます。</div>';
  return `<div class="search-section-title">最近使った</div>${list.map(p => `<div class="search-result"><button class="prompt-main" data-action="detail-modal" data-id="${escapeHTML(p.id)}"><div class="search-result-title">${escapeHTML(p.title)}</div><div class="search-result-meta">v${versionNumber(activeVersion(p))}</div></button><button class="copy-btn" data-action="copy" data-id="${escapeHTML(p.id)}">コピー</button></div>`).join('')}`;
}
function renderMobileSearchResults() {
  const q = $('mobile-search-input').value.trim().toLocaleLowerCase('ja');
  const host = $('mobile-search-results');
  if (!q) {
    host.innerHTML = renderRecentSearchSeed(recentPrompts(5));
    return;
  }
  const scored = state.prompts.map(p => {
    const title = p.title.toLocaleLowerCase('ja');
    const tags = p.tags.join(' ').toLocaleLowerCase('ja');
    const bodies = p.versions.map(v => v.body).join('\n').toLocaleLowerCase('ja');
    let score = title === q ? 100 : title.startsWith(q) ? 80 : title.includes(q) ? 60 : tags.includes(q) ? 30 : bodies.includes(q) ? 10 : 0;
    return {p,score};
  }).filter(x => x.score).sort((a,b) => b.score-a.score);
  host.innerHTML = scored.length ? `<div class="search-section-title">検索結果</div>${scored.map(({p,score}) => { const reason=score>=60?'タイトル一致':score>=30?'タグ一致':'本文一致'; const snippet=score<30?snippetForQuery(p,q):''; return `<div class="search-result"><button class="prompt-main" data-action="detail-modal" data-id="${escapeHTML(p.id)}"><div class="search-result-title">${escapeHTML(p.title)}</div><div class="search-result-meta">${reason} ・ v${versionNumber(activeVersion(p))}</div>${snippet?`<div class="search-result-snippet">${snippet}</div>`:''}</button><button class="copy-btn" data-action="copy" data-id="${escapeHTML(p.id)}">コピー</button></div>`;}).join('')}` : '<div class="empty"><strong>見つかりませんでした</strong><p>別の検索語を試してください。</p></div>';
}

function handleAction(el, event) {
  const action = el.dataset.action;
  const id = el.dataset.id;
  const version = el.dataset.version;
  if (!action) return false;
  event?.stopPropagation();
  switch(action) {
    case 'copy': copyPrompt(id, null, el); break;
    case 'copy-version': copyPrompt(id, Number(version), el); break;
    case 'detail': openDetail(id); break;
    case 'detail-modal': closeModal(true); openDetail(id); break;
    case 'close-detail': closeDetail(); break;
    case 'menu': state.openMenuId = state.openMenuId === id ? null : id; renderList(); break;
    case 'edit': state.openMenuId=null; openPromptEditor(id); break;
    case 'toggle-current': toggleCurrent(id); break;
    case 'history': state.openMenuId=null; openHistory(id); break;
    case 'delete': deletePrompt(id); break;
    case 'new': openNewPrompt(); break;
    case 'goto-all': setView('all'); break;
    case 'reorder': state.openMenuId=null; openReorder(); break;
    case 'new-version': closeModal(true); openNewVersion(id, Number(version)); break;
    case 'set-active-version': setActiveVersion(id, Number(version)); break;
    case 'toggle-star': toggleStar(id, Number(version)); break;
    case 'star-note': editStarNote(id, Number(version)); break;
    case 'compare-selected': compareSelected(id); break;
    case 'toggle-version': {
      const body = document.getElementById(`vc-${id}-${version}`);
      if (body) {
        const nowHidden = body.classList.toggle('hidden');
        el.textContent = nowHidden ? '本文と操作を表示' : '本文と操作を閉じる';
      }
      break;
    }
    case 'reorder-up': movePrompt(id,-1); break;
    case 'reorder-down': movePrompt(id,1); break;
    case 'filter-tag': state.tagFilter = el.dataset.tag; state.view='all'; closeDetail(); render(); break;
    default: return false;
  }
  return true;
}

function bindEvents() {
  document.addEventListener('click', (e) => {
    const actionEl = e.target.closest('[data-action]');
    if (actionEl && handleAction(actionEl,e)) return;
    const closeEl = e.target.closest('[data-modal-close]');
    if (closeEl) { e.preventDefault(); closeModal(); return; }
    if (!e.target.closest('.row-menu-wrap') && state.openMenuId) {
      state.openMenuId = null;
      renderList();
    }
  });

  document.querySelectorAll('[data-view]').forEach(btn => btn.addEventListener('click', () => setView(btn.dataset.view)));
  $('new-desktop').addEventListener('click', openNewPrompt);
  $('new-mobile').addEventListener('click', openNewPrompt);
  $('mobile-search-btn').addEventListener('click', openSearchModal);
  $('recent-link').addEventListener('click', openRecent);
  $('reorder-link').addEventListener('click', openReorder);
  $('data-link').addEventListener('click', openBackup);
  $('detail-scrim').addEventListener('click', closeDetail);
  $('clear-filter-btn').addEventListener('click', () => { state.tagFilter=null; render(); });

  $('desktop-search').addEventListener('input', (e) => {
    state.searchQuery = e.target.value;
    $('desktop-search-clear').classList.toggle('hidden', !state.searchQuery);
    renderList();
  });
  $('desktop-search-clear').addEventListener('click', () => {
    state.searchQuery = '';
    $('desktop-search').value = '';
    $('desktop-search-clear').classList.add('hidden');
    renderList();
    $('desktop-search').focus();
  });

  window.addEventListener('resize', renderDetail);
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      if (isMobile()) openSearchModal();
      else $('desktop-search').focus();
    } else if (e.key === '/' && !['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)) {
      e.preventDefault();
      if (isMobile()) openSearchModal();
      else $('desktop-search').focus();
    } else if (e.key === 'Escape') {
      if (state.modal) closeModal();
      else if (state.selectedId) closeDetail();
      else if (state.openMenuId) { state.openMenuId=null; renderList(); }
    }
  });
}

loadData();
state.view = currentSet().length ? 'current' : 'all';
bindEvents();
render();
if (state.startupNotice) setTimeout(() => showToast(state.startupNotice, 4200), 300);

})();
</script>
</body>
</html>
